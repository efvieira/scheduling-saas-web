# Sobe o frontend junto com a API publicada (scheduling-saas-api) e o Postgres.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agenda
      POSTGRES_USER: agenda
      POSTGRES_PASSWORD: agenda
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenda"]
      interval: 5s
      retries: 10

  api:
    image: ${API_IMAGE:-ghcr.io/efvieira/scheduling-saas-api:latest}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/agenda
      DEMO_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: .
    ports:
      - "4200:80"
    depends_on:
      - api
