name: CI

on:
  push:
    branches: [develop, release, master, 'feature/**', 'hotfix/**']
  pull_request:
    branches: [develop, release, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build e testes (Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - name: Testes (Vitest)
        run: npx ng test --watch=false
      - name: Build de produção
        run: npx ng build
